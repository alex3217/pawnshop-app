name: PawnShop Core CI

on:
  # Validate every pull request, including stacked PRs.
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pawnshop-core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scanner-candidate-validation:
    name: Secret Scanner Candidate Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Test secret scanner
        run: node --test scripts/secret-scan.test.mjs

      - name: Scan tracked files
        run: node scripts/secret-scan.mjs --tracked

      - name: Scan introduced history
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-secret-history-scan.sh

  web-api-validation:
    name: Web and API Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://example-user:test-only-password@127.0.0.1:5432/pawnshop_ci?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/api/backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: Install backend dependencies
        run: npm --prefix apps/api/backend ci

      - name: Audit migration ordering and database target safeguards
        run: |
          npm run check:migration-prefixes
          npm run test:database-safety

      - name: Frontend lint
        run: npm --prefix apps/web run lint

      - name: Frontend production build
        run: npm run build:web

      - name: Generate and validate Prisma client
        working-directory: apps/api/backend
        run: |
          npx prisma generate
          npx prisma validate

      - name: Static safety checks
        run: npm run check:static-safety

      - name: Staging deployment contract tests
        run: npm run test:staging-readiness

      - name: Frontend route audit
        run: npm run check:frontend-routes

      - name: Backend route audit
        run: npm run check:backend-routes

      - name: Root production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend production dependency audit
        run: npm --prefix apps/web audit --omit=dev --audit-level=high

      - name: Backend production dependency audit
        run: npm --prefix apps/api/backend audit --omit=dev --audit-level=high

  mobile-validation:
    name: Mobile TypeScript Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Mobile TypeScript compilation
        working-directory: apps/mobile
        run: npx tsc --noEmit

  backend-tests:
    name: Backend Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: example_user
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pawnshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U example_user -d pawnshop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_ENV: test
      AUCTION_SCHEDULER_ENABLED: "false"
      JWT_SECRET: not-for-production-jwt-signing-secret
      DATABASE_URL: postgresql://example_user:test-only-password@127.0.0.1:5432/pawnshop_test?schema=public
      CONFIRM_DISPOSABLE_DATABASE: YES_DELETE_TEST_DATA

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: apps/api/backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix apps/api/backend ci

      - name: Audit backend dependencies
        run: npm --prefix apps/api/backend audit --audit-level=high

      - name: Run backend automated tests
        run: npm --prefix apps/api/backend run test:all
