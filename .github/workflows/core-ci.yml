name: PawnShop Core CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pawnshop-core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-api-validation:
    name: Web and API Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pawnshop_ci?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/api/backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: Install backend dependencies
        run: npm --prefix apps/api/backend ci

      - name: Frontend lint
        run: npm --prefix apps/web run lint

      - name: Deployment environment contract tests
        run: node --test apps/web/test/build-environment.test.mjs apps/web/test/core-ci-playwright.contract.test.mjs apps/web/test/environment-contract.test.mjs apps/web/test/environment-contract-consumption.test.mjs apps/web/test/environment-indicator.runtime.test.mjs apps/web/test/seller-plan-control.contract.test.mjs apps/web/test/upload-workflow.contract.test.mjs scripts/test-deployment-environment-cli.mjs

      - name: Validate Production deployment target
        run: node scripts/check-deployment-environment.mjs
        env:
          VITE_DEPLOY_ENV: production
          VITE_API_ORIGIN: https://api.pawnloop.com
          VITE_API_BASE: /api
          VITE_SOCKET_URL: https://api.pawnloop.com
          VITE_SOCKET_PATH: /socket.io

      - name: Frontend production build
        run: npm run build:web
        env:
          VITE_DEPLOY_ENV: production
          VITE_API_ORIGIN: https://api.pawnloop.com
          VITE_API_BASE: /api
          VITE_SOCKET_URL: https://api.pawnloop.com
          VITE_SOCKET_PATH: /socket.io

      - name: Validate Preview deployment target
        run: node scripts/check-deployment-environment.mjs
        env:
          VITE_DEPLOY_ENV: preview
          VITE_API_ORIGIN: https://pawnshop-staging-api.onrender.com
          VITE_API_BASE: /api
          VITE_SOCKET_URL: https://pawnshop-staging-api.onrender.com
          VITE_SOCKET_PATH: /socket.io

      - name: Frontend preview build contract
        run: npm run build:web
        env:
          VITE_DEPLOY_ENV: preview
          VITE_API_ORIGIN: https://pawnshop-staging-api.onrender.com
          VITE_API_BASE: /api
          VITE_SOCKET_URL: https://pawnshop-staging-api.onrender.com
          VITE_SOCKET_PATH: /socket.io

      - name: Generate and validate Prisma client
        working-directory: apps/api/backend
        run: |
          npx prisma generate
          npx prisma validate

      - name: Static safety checks
        run: npm run check:static-safety

      - name: Staging deployment contract tests
        run: npm run test:staging-readiness

      - name: Frontend route audit
        run: npm run check:frontend-routes

      - name: Backend route audit
        run: npm run check:backend-routes

      - name: Root production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend production dependency audit
        run: npm --prefix apps/web audit --omit=dev --audit-level=high

      - name: Backend production dependency audit
        run: npm --prefix apps/api/backend audit --omit=dev --audit-level=high

  mobile-validation:
    name: Mobile TypeScript Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Mobile TypeScript compilation
        working-directory: apps/mobile
        run: npx tsc --noEmit

  backend-tests:
    name: Backend Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pawnshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pawnshop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_ENV: test
      AUCTION_SCHEDULER_ENABLED: "false"
      JWT_SECRET: pawnloop-core-tests-only-secret-2026-not-for-production
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pawnshop_test?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: apps/api/backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix apps/api/backend ci

      - name: Audit backend dependencies
        run: node scripts/validate-backend-audit.mjs

      - name: Test backend audit exception validator
        run: node --test scripts/test-backend-audit-validator.mjs

      - name: Run backend automated tests
        run: npm --prefix apps/api/backend run test:all

      - name: Run focused HTTP and Socket.IO CORS policy tests
        run: node --test --test-concurrency=1 apps/api/backend/test/app.contract.test.js apps/api/backend/test/socketCors.test.js apps/api/backend/test/deployedCorsRuntimeGuard.test.js

  seller-subscription-browser-tests:
    name: Seller Subscription Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: Configure resilient Ubuntu package downloads
        run: |
          printf '%s\n' \
            'Acquire::Retries "5";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/80-pawnloop-ci-network >/dev/null

      - name: Install Chromium and Linux browser dependencies
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium

      - name: Run seller subscription browser tests
        run: npm --prefix apps/web run test:ci:seller-subscription

      - name: Run payment methods browser tests
        working-directory: apps/web
        run: npx playwright test payment-methods.spec.ts buyer-dashboard-light-readability.spec.ts --config playwright.marketplace.config.ts

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seller-subscription-playwright-${{ github.run_id }}
          path: |
            apps/web/.playwright/seller-subscription-report
            apps/web/.playwright/seller-subscription-results
          if-no-files-found: warn
          retention-days: 7
