name: Release Candidate QA

on:
  pull_request:
    branches:
      - main
      - fix/release-candidate-qa-accessibility-v1
  push:
    branches:
      - fix/release-candidate-qa-accessibility-v1

permissions:
  contents: read

concurrency:
  group: release-candidate-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-release-candidate:
    name: Chromium release candidate (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - name: Run full Chromium shard
        working-directory: apps/web
        run: npx playwright test --config=playwright.release-candidate.config.ts --project=chromium --shard=${{ matrix.shard }}/4
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc-chromium-${{ matrix.shard }}-${{ github.run_id }}
          path: apps/web/.playwright
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  cross-browser-critical:
    name: Critical ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox-critical
            browser: firefox
          - project: webkit-critical
            browser: webkit
          - project: mobile-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - name: Configure resilient Ubuntu package downloads
        run: |
          printf '%s\n' \
            'Acquire::Retries "5";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/80-pawnloop-ci-network >/dev/null
      - name: Install required browser and Linux dependencies
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npm --prefix apps/web exec -- playwright install --with-deps ${{ matrix.browser }}
      - name: Run critical browser project
        working-directory: apps/web
        run: npx playwright test --config=playwright.release-candidate.config.ts --project=${{ matrix.project }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc-${{ matrix.project }}-${{ github.run_id }}
          path: apps/web/.playwright
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  qa-contracts:
    name: QA isolation and workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - run: node --test apps/web/test/release-candidate-env.test.mjs apps/web/test/release-candidate-playwright.contract.test.mjs
