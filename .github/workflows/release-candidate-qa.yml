name: Release Candidate QA

on:
  pull_request:
    branches:
      - main
      - fix/release-candidate-qa-accessibility-v1
  push:
    branches:
      - main
      - fix/release-candidate-qa-accessibility-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-release-candidate:
    name: Chromium release candidate (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001 --ipc=host --init
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - name: Run full Chromium shard
        working-directory: apps/web
        run: npx playwright test --config=playwright.release-candidate.config.ts --project=chromium --shard=${{ matrix.shard }}/4
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-chromium-${{ matrix.shard }}-${{ github.run_id }}
          path: apps/web/.playwright
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  cross-browser-critical:
    name: Critical ${{ matrix.project }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001 --ipc=host --init
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox-critical
            browser: firefox
          - project: webkit-critical
            browser: webkit
          - project: mobile-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - name: Run critical browser project
        working-directory: apps/web
        run: npx playwright test --config=playwright.release-candidate.config.ts --project=${{ matrix.project }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-${{ matrix.project }}-${{ github.run_id }}
          path: apps/web/.playwright
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  qa-contracts:
    name: QA isolation and workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
      - run: node --test apps/web/test/release-candidate-env.test.mjs apps/web/test/release-candidate-playwright.contract.test.mjs
