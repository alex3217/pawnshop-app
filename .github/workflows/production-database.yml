name: PawnLoop Production Database Migration

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Certified immutable 40-character release SHA
        required: true
        type: string
      production_database_host:
        description: Exact approved production database hostname (no scheme or path)
        required: true
        type: string
      backup_evidence:
        description: URL or ID for fresh backup and restore-verification evidence
        required: true
        type: string
      backup_confirmation:
        description: Type BACKUP_EVIDENCE_VERIFIED
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pawnloop-production-database
  cancel-in-progress: false

jobs:
  migrate-production:
    name: Guarded Production Migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APPROVED_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      PRODUCTION_API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
      PRODUCTION_RENDER_ORIGIN: ${{ vars.PRODUCTION_RENDER_ORIGIN }}
      PRODUCTION_RENDER_SERVICE_ID: ${{ vars.PRODUCTION_RENDER_SERVICE_ID }}
      PRODUCTION_RENDER_SERVICE_NAME: ${{ vars.PRODUCTION_RENDER_SERVICE_NAME }}
      PRODUCTION_RENDER_ENVIRONMENT_ID: ${{ vars.PRODUCTION_RENDER_ENVIRONMENT_ID }}
      PRODUCTION_RENDER_SOURCE_SHA: ${{ vars.PRODUCTION_RENDER_SOURCE_SHA }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRMED_DATABASE_HOST: ${{ inputs.production_database_host }}
      BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
      BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}

    steps:
      - name: Validate immutable release and operator confirmations
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BACKUP_CONFIRMATION" = "BACKUP_EVIDENCE_VERIFIED"
          test -n "$BACKUP_EVIDENCE"
          test "$CONFIRMED_DATABASE_HOST" = "$APPROVED_PRODUCTION_DATABASE_HOST"

      - name: Check out certified release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify certified SHA is on origin main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Verify production containment before preparation
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/verify-production-containment.mjs

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: apps/api/backend/package-lock.json

      - name: Install certified backend dependencies without lifecycle scripts
        run: npm --prefix apps/api/backend ci --ignore-scripts

      - name: Generate and validate certified Prisma client explicitly
        working-directory: apps/api/backend
        env:
          DATABASE_URL: postgresql://schema-validation.invalid/pawnloop
          DIRECT_URL: postgresql://schema-validation.invalid/pawnloop
        run: |
          npx --no-install prisma generate
          npx --no-install prisma validate

      - name: Verify exact production database target
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const value = process.env.DATABASE_URL || "";
          const approved = process.env.APPROVED_PRODUCTION_DATABASE_HOST || "";
          const confirmed = process.env.CONFIRMED_DATABASE_HOST || "";
          if (!approved || confirmed !== approved) throw new Error("Production database host confirmation mismatch.");
          let parsed; try { parsed = new URL(value); } catch { throw new Error("Production DATABASE_URL is invalid."); }
          if (!["postgres:", "postgresql:"].includes(parsed.protocol) || parsed.hostname !== approved) throw new Error("Production database target mismatch.");
          if (approved === "localhost" || approved.endsWith(".localhost") || /^127(?:\.|$)/.test(approved)) throw new Error("Production database host must not be local.");
          console.log("Production database target verified without exposing connection details.");
          NODE

      - name: Record pre-migration status
        working-directory: apps/api/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
        run: npx --no-install prisma migrate status

      - name: Re-verify production containment immediately before migration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/verify-production-containment.mjs

      - name: Apply certified production migrations
        working-directory: apps/api/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
        run: npx --no-install prisma migrate deploy

      - name: Verify post-migration status
        working-directory: apps/api/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
        run: npx --no-install prisma migrate status
