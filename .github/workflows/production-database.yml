name: PawnLoop Production Database Migration

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Certified immutable 40-character release SHA
        required: true
        type: string
      production_database_host:
        description: Exact approved production database hostname (no scheme or path)
        required: true
        type: string
      backup_evidence:
        description: URL or ID for the fresh backup and restore-verification evidence
        required: true
        type: string
      backup_confirmation:
        description: Type BACKUP_EVIDENCE_VERIFIED
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pawnloop-production-database
  cancel-in-progress: false

jobs:
  migrate-production:
    name: Guarded Production Migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      APPROVED_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      PRODUCTION_API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRMED_DATABASE_HOST: ${{ inputs.production_database_host }}
      BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
      BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}

    steps:
      - name: Validate immutable release and operator confirmations
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release SHA must be a full lowercase 40-character Git SHA."
            exit 1
          fi

          if [ "$BACKUP_CONFIRMATION" != "BACKUP_EVIDENCE_VERIFIED" ]; then
            echo "Exact backup-evidence confirmation was not supplied."
            exit 1
          fi

          if [ -z "$BACKUP_EVIDENCE" ]; then
            echo "A backup and restore-verification evidence reference is required."
            exit 1
          fi

      - name: Verify exact production database target
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const databaseUrl = process.env.DATABASE_URL || "";
          const approvedHost = process.env.APPROVED_PRODUCTION_DATABASE_HOST || "";
          const confirmedHost = process.env.CONFIRMED_DATABASE_HOST || "";
          const hostnamePattern = /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)(?:\.(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?))*$/i;

          if (!databaseUrl) throw new Error("Missing production DATABASE_URL secret.");
          if (!approvedHost || !hostnamePattern.test(approvedHost)) {
            throw new Error("PRODUCTION_DATABASE_HOST must be a valid hostname-only production variable.");
          }
          const normalizedHost = approvedHost.toLowerCase();
          if (normalizedHost === "localhost" || normalizedHost.endsWith(".localhost") || /^127(?:\.|$)/.test(normalizedHost)) {
            throw new Error("PRODUCTION_DATABASE_HOST must not be local or loopback.");
          }
          if (confirmedHost !== approvedHost) {
            throw new Error("Operator database host confirmation does not exactly match the approved production host.");
          }

          let parsed;
          try {
            parsed = new URL(databaseUrl);
          } catch {
            throw new Error("Production DATABASE_URL is invalid.");
          }
          if (!["postgres:", "postgresql:"].includes(parsed.protocol)) {
            throw new Error("Production DATABASE_URL is not PostgreSQL.");
          }
          if (parsed.hostname !== approvedHost) {
            throw new Error("Production DATABASE_URL does not exactly target the approved host.");
          }
          console.log("Production database target verified without exposing connection details.");
          NODE

      - name: Check out certified release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify certified SHA is on origin main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: apps/api/backend/package-lock.json

      - name: Install certified backend dependencies
        run: npm --prefix apps/api/backend ci

      - name: Validate certified Prisma schema
        working-directory: apps/api/backend
        run: |
          npx --no-install prisma generate
          npx --no-install prisma validate

      - name: Record pre-migration status
        working-directory: apps/api/backend
        shell: bash
        run: |
          set +e
          npx --no-install prisma migrate status
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "Prisma migration status inspection failed unexpectedly."
            exit "$status"
          fi
          echo "Pre-migration status inspected; the guarded application step remains authoritative for pending migrations."

      - name: Re-verify all mutation guards
        shell: bash
        run: |
          set -euo pipefail
          test "$BACKUP_CONFIRMATION" = "BACKUP_EVIDENCE_VERIFIED"
          test -n "$BACKUP_EVIDENCE"
          test "$CONFIRMED_DATABASE_HOST" = "$APPROVED_PRODUCTION_DATABASE_HOST"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Apply certified production migrations
        working-directory: apps/api/backend
        run: npx --no-install prisma migrate deploy

      - name: Verify post-migration status
        working-directory: apps/api/backend
        run: npx --no-install prisma migrate status

      - name: Verify production readiness gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const value = process.env.PRODUCTION_API_ORIGIN || "";
          let url;
          try { url = new URL(value); } catch { throw new Error("PRODUCTION_API_ORIGIN is invalid."); }
          if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash) {
            throw new Error("PRODUCTION_API_ORIGIN must be a credential-free HTTPS origin.");
          }
          NODE
          readiness_url="$(node -e 'const u=new URL(process.env.PRODUCTION_API_ORIGIN); process.stdout.write(new URL("/api/ready",u).href)')"
          curl --fail --silent --show-error --max-time 15 --retry 2 --retry-all-errors "$readiness_url" >/dev/null
          echo "Production /api/ready gate passed."
