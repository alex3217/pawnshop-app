name: Trusted Secret Leak Prevention

on:
  pull_request_target: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-leak-prevention:
    name: Secret Leak Prevention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out trusted enforcement code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Test trusted secret scanner
        run: node --test scripts/secret-scan.test.mjs

      - name: Fetch and verify untrusted pull-request objects
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-fetch-trusted-pr-objects.sh

      - name: Scan exact event head tree with trusted code
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/secret-scan.mjs --tree "$HEAD_SHA"

      - name: Scan exact event history with trusted code
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-secret-history-scan.sh
