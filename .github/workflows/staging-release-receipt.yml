name: PawnLoop Staging Release Receipt

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main SHA approved for staging application deployment
        required: true
        type: string
      migration_run_id:
        description: Successful PawnLoop Staging Database apply_migrations run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  authorize-staging-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fail closed on SHA mismatch
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Authenticate migration run and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error "${auth[@]}" "$api/actions/workflows/staging-database.yml" -o "$RUNNER_TEMP/workflow.json"
          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$MIGRATION_RUN_ID" -o "$RUNNER_TEMP/run.json"
          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$MIGRATION_RUN_ID/artifacts?per_page=100" -o "$RUNNER_TEMP/artifacts.json"
          EXPECTED_RELEASE_SHA="$RELEASE_SHA" EXPECTED_MIGRATION_RUN_ID="$MIGRATION_RUN_ID" node scripts/verify-staging-run-provenance.mjs "$RUNNER_TEMP/workflow.json" "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/artifacts.json" "$RUNNER_TEMP/selected-artifact.json"
          artifact_id="$(jq -er '.id' "$RUNNER_TEMP/selected-artifact.json")"
          artifact_digest="$(jq -er '.digest' "$RUNNER_TEMP/selected-artifact.json")"
          curl --fail --silent --show-error --location "${auth[@]}" "$api/actions/artifacts/$artifact_id/zip" -o "$RUNNER_TEMP/migration-evidence.zip"
          test "$artifact_digest" = "sha256:$(sha256sum "$RUNNER_TEMP/migration-evidence.zip" | awk '{print $1}')"
          mkdir -p "$RUNNER_TEMP/migration-evidence"
          unzip -q "$RUNNER_TEMP/migration-evidence.zip" -d "$RUNNER_TEMP/migration-evidence"

      - name: Verify exact-SHA migration receipt
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
        run: |
          set -euo pipefail
          registry_digest="$(find apps/api/backend/prisma/migrations -type f -name migration.sql -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          EXPECTED_REGISTRY_DIGEST="$registry_digest" node scripts/verify-staging-migration-evidence.mjs "$RUNNER_TEMP/migration-evidence/staging-migration-receipt.json"

      - name: Emit manual deployment authorization receipt
        run: |
          echo "Exact-SHA migrations are verified. This workflow does not deploy or contact Render."
          echo "A separately authorized operator must bind the manual Render deployment to ${{ inputs.release_sha }} and retain the provider deployment receipt."
